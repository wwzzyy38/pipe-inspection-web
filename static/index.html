<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jetson · 管道巡检</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header class="top"><div class="brand"><span class="mark" aria-hidden="true">◎</span><div><strong>管道巡检台</strong><small>Jetson</small></div></div><nav aria-label="工作模式"><button id="tabReplay" aria-pressed="true">记录回放</button><button id="tabLive" aria-pressed="false">实时识别</button></nav><div class="top-access"><div id="connection">连接工作台…</div><button id="signOut" type="button" hidden>退出</button></div></header>
<main><div class="heading"><div><h1 id="title">记录回放</h1><p id="subtitle">选择会话，回看管内图像和三维点云。</p></div><span id="badge" hidden>演示数据</span></div>
<div class="board">
<aside class="library" id="library"><div class="bar"><h2>机上记录</h2><button id="reload" title="刷新记录" aria-label="刷新记录">↻</button></div><div id="sessions"></div><p class="aside-note" id="listNote"></p></aside>
<section class="cloud panel"><div class="bar"><h2>三维点云</h2><div class="cloud-options"><label class="label">坐标 <select id="cloudSpace"><option value="body">原始坐标</option><option value="start" disabled>起始坐标</option></select></label><label class="label">轨道 <select id="cloudTrack"></select></label></div></div><div class="scene"><canvas id="viewer" aria-label="方向键旋转，正负号缩放，Home 复位" tabindex="0"></canvas><div id="cloudEmpty" class="empty">选择点云记录</div><div class="view-shortcuts" aria-label="点云视角"><button type="button" data-view="front">正视</button><button type="button" data-view="top">俯视</button><button type="button" data-view="bottom">底视</button></div><button id="reset" class="reset">复位视角</button></div><div class="foot"><span id="cloudMeta">尚未加载</span><span>左拖旋转 / 右拖或中键平移 / 滚轮对准光标缩放</span></div><div class="reference-row"><span id="referenceNote">起始参考面未加载</span><label><input id="showGrid" type="checkbox" checked disabled>显示 XY 参考面</label></div><div id="predictionPanel" class="prediction" hidden><div><strong>PointNeXt 分割</strong><span id="predictionStatus" role="status"></span><progress id="predictionProgress" value="0" max="1" aria-label="分割生成进度" hidden></progress></div><button id="predictionAction" type="button">生成分割结果</button></div><div id="legend" class="legend" hidden></div></section>
<div class="column"><section class="panel"><div class="bar"><h2>巡检视频</h2><label class="label">轨道 <select id="videoTrack"></select></label></div><div class="video"><video id="player" preload="metadata" playsinline controls hidden></video><img id="liveImage" alt="飞机实时画面" hidden><p id="videoEmpty" class="empty">选择视频记录</p></div><div class="foot" id="videoMeta">尚未加载</div></section>
<section class="panel" id="modelPanel" hidden><div class="bar"><h2>机载识别</h2></div><div id="modelRows"></div><p id="modelNote" class="aside-note" role="status"></p></section>
<section class="panel note" id="replayNote"><h2>回放说明</h2><p id="syncNote">载入记录后可拖动时间轴，跳到任意时刻。</p></section></div></div>
<section class="panel timeline" id="timeline"><div class="transport"><h2 id="timeTitle">点云时间轴</h2><button id="play" class="primary" disabled>播放</button><button id="begin" disabled>回到起点</button><label class="label">速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><output id="clock">00:00.0 / 00:00.0</output></div><input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="点云回放时间" disabled></section>
</main></body></html>
