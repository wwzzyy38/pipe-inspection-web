<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置 Jetson 访问密码</title><link rel="stylesheet" href="/style.css"></head>
<body class="login-body"><main class="login-shell"><header class="brand"><span class="mark" aria-hidden="true">◎</span><div><strong>管道巡检台</strong><small>Jetson</small></div></header>
<section class="login-card"><h1>设置访问密码</h1><p id="setup-note" role="status">{{MESSAGE}}</p>
<form method="post" action="/setup"><label for="new-password">新密码（至少 12 个字符）</label><input id="new-password" type="password" name="password" required minlength="12" maxlength="256" autocomplete="new-password" aria-describedby="setup-note">
<label for="confirm-password">再输入一次</label><input id="confirm-password" type="password" name="confirm" required minlength="12" maxlength="256" autocomplete="new-password"><button type="submit" class="primary">保存密码</button></form></section>
<p class="login-network">保存后，请用刚设置的密码登录。不需要用户名。</p></main></body></html>
